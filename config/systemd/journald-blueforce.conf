# Purpose: Bound journald disk use on field devices while keeping history.
# Scope: Persistent storage with caps; install to /etc/systemd/journald.conf.d/.
# Safety: Reboot-safe; apply with systemctl restart systemd-journald.
# Ref: docs/15-LOGGING.md, K-14.
[Journal]
Storage=persistent
SystemMaxUse=500M
RuntimeMaxUse=100M
MaxFileSec=14day
