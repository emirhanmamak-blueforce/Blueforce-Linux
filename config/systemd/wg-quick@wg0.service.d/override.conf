# Purpose: Keep the WireGuard tunnel up across failures without manual action.
# Scope: Drop-in for wg-quick@wg0; restarts the tunnel with a short backoff.
# Safety: Reboot-safe once the unit is enabled; confirm on the LAB 26.04.1 image.
# Ref: docs/08-WIREGUARD-AND-NETWORK.md and docs/16-POWER-LOSS-AND-AUTO-RECOVERY.md, K-05.
[Service]
Restart=always
RestartSec=5
